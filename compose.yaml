services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wallnut
      POSTGRES_USER: wallnut
      POSTGRES_PASSWORD: wallnut_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - points_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallnut -d wallnut"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  points_data:

